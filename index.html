<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7f4">
<title>My Planner ♡</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fbf7f4;--paper:#fffefd;--ink:#403839;--muted:#9b8f90;--line:#eee3e1;--pink:#f4d9df;--blue:#dceaf5;--sage:#dfeadf;--lav:#e7def1;--peach:#f7e2d4;--yellow:#f6edcf;--shadow:0 10px 30px #70505012}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))}
header{padding:20px 5px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,serif;font-size:28px}.sub{color:var(--muted);font-size:13px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin:10px 0}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.btn{border:0;border-radius:14px;padding:10px 13px;background:#f1e8e6;color:var(--ink)}.primary{background:#eecfd6}.round{width:44px;height:44px;border-radius:50%;font-size:24px;padding:0}
h2,h3,p{margin:5px 0}h2{font:22px Georgia,serif}h3{font-size:15px}.muted{color:var(--muted);font-size:13px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffefdf2;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{width:min(25%,190px);border:0;background:none;padding:10px 2px;color:#8d8182;font-size:11px}.tabs b{display:block;font-size:20px;margin-bottom:2px}.tabs .on{color:#7d5960}
.hidden{display:none!important}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.month{font:22px Georgia,serif}
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekdays div{text-align:center;color:var(--muted);font-size:11px;padding:5px}.day{min-height:78px;border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff;overflow:hidden}.day.other{opacity:.38}.day.today{outline:2px solid #e8c3cc}.num{font-size:12px;margin-bottom:4px}.event{font-size:9px;border-radius:6px;padding:3px 4px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dots{display:flex;gap:2px;flex-wrap:wrap}.dot{width:6px;height:6px;border-radius:50%}
.listitem{padding:11px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.check{width:22px;height:22px;border:1.5px solid #d7c7c8;border-radius:7px;background:white;flex:0 0 auto}.check.done{background:#dce8dd}.doneText{text-decoration:line-through;color:var(--muted)}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 10px;font-size:12px}.calrow{display:flex;align-items:center;gap:10px;padding:9px 0}.swatch{width:16px;height:16px;border-radius:50%}.switch{margin-left:auto;width:42px;height:24px;background:#ddd;border-radius:99px;padding:3px}.switch i{display:block;width:18px;height:18px;border-radius:50%;background:white;transition:.2s}.switch.on i{margin-left:18px}.switch.on{background:#bfcfbf}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px;color:var(--ink)}textarea{min-height:70px;resize:vertical}.label{font-size:12px;color:var(--muted);margin:11px 2px 5px}.modal{position:fixed;inset:0;background:#463b3b55;display:flex;align-items:flex-end;justify-content:center;z-index:50}.sheet{background:var(--bg);width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:25px 25px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.fab{position:fixed;right:20px;bottom:82px;z-index:25;background:#e9c5ce;box-shadow:0 7px 18px #73505b25}.progress{height:8px;background:#eee6e4;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:#cbdccf}
.chips{display:flex;gap:7px;overflow:auto;padding:4px 0}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:7px 10px;background:#fff;font-size:12px}
.auth{max-width:430px;margin:40px auto}.share{font-size:11px;margin-left:6px;padding:3px 7px;border-radius:99px;background:#f5eeee}
@media(max-width:480px){.day{min-height:76px;padding:4px}.event{display:block;font-size:8px;padding:2px 3px}.grid{gap:3px}.card{padding:14px}.brand{font-size:25px}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">My Planner ♡</div><div class="sub" id="hello">Family Sync</div></div><button class="btn" id="calBtn" onclick="openCalendars()">Kalender</button></header>
<main id="view"></main>
<button class="btn round fab" id="fab" onclick="openAdd()">＋</button>
<nav class="tabs" id="tabs">
<button data-tab="today" onclick="tab('today')"><b>♡</b>Heute</button>
<button data-tab="month" onclick="tab('month')"><b>▦</b>Kalender</button>
<button data-tab="tasks" onclick="tab('tasks')"><b>✓</b>Aufgaben</button>
<button data-tab="family" onclick="tab('family')"><b>⌂</b>Familie</button>
</nav>
</div><div id="modal"></div>
<script>
const SUPABASE_URL="https://ijgfuksbvggowqzgucjp.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqZ2Z1a3Nidmdnb3dxemd1Y2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MTUxMTksImV4cCI6MjEwNTQ5MTExOX0.D8aHYQw7s3Gcg61Nzu8vWQHlj6ZKM2JnE6djnzq2cP4";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null, calendars=[], events=[], tasks=[], tabName="today", cursor=new Date();cursor.setDate(1);
const esc=s=>(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const iso=d=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}, today=()=>iso(new Date());
function showAuth(msg=""){document.getElementById("tabs").style.display="none";document.getElementById("fab").style.display="none";document.getElementById("calBtn").style.display="none";document.getElementById("view").innerHTML=`<div class="card auth"><div class="muted">FAMILY PLANNER</div><h2>Willkommen ♡</h2><p class="muted">Melde dich an oder erstelle ein Konto.</p>${msg?`<p>${esc(msg)}</p>`:""}<div class="label">E-Mail</div><input id="aEmail" type="email"><div class="label">Passwort</div><input id="aPass" type="password"><button class="btn primary" style="width:100%;margin-top:14px" onclick="login()">Anmelden</button><button class="btn" style="width:100%;margin-top:8px" onclick="signup()">Konto erstellen</button></div>`}
async function login(){let {error}=await db.auth.signInWithPassword({email:aEmail.value,password:aPass.value});if(error)return alert(error.message);await boot()}
async function signup(){let {error}=await db.auth.signUp({email:aEmail.value,password:aPass.value,options:{data:{display_name:aEmail.value.split("@")[0]}}});if(error)return alert(error.message);showAuth("Konto erstellt. Falls Supabase eine Bestätigungsmail verlangt, bestätige sie und melde dich danach an.")}
async function logout(){await db.auth.signOut();user=null;showAuth()}
async function boot(){let {data:{user:u}}=await db.auth.getUser();user=u;if(!user)return showAuth();document.getElementById("tabs").style.display="flex";document.getElementById("fab").style.display="block";document.getElementById("calBtn").style.display="block";await load();subscribe();render()}
async function load(){let [c,e,t]=await Promise.all([db.from("calendars").select("*").order("name"),db.from("events").select("*").order("start_date"),db.from("tasks").select("*").order("due_date")]);if(c.error)console.warn(c.error);calendars=c.data||[];events=e.data||[];tasks=t.data||[]}
function subscribe(){db.channel("planner-live").on("postgres_changes",{event:"*",schema:"public",table:"events"},async()=>{await load();render()}).on("postgres_changes",{event:"*",schema:"public",table:"calendars"},async()=>{await load();render()}).on("postgres_changes",{event:"*",schema:"public",table:"tasks"},async()=>{await load();render()}).subscribe()}
function tab(t){tabName=t;render()} function nav(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tabName))}
function cal(id){return calendars.find(c=>c.id===id)||{name:"Kalender",icon:"♡",color:"#f4d9df"}}
function occurs(e,d){return d>=(e.start_date||"")&&d<=(e.end_date||e.start_date||"")}
function visibleEvents(d){return events.filter(e=>occurs(e,d))}
function render(){if(!user)return showAuth();document.getElementById("hello").textContent=new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long"}).format(new Date());nav();let v=document.getElementById("view");if(tabName==="month")v.innerHTML=monthView();else if(tabName==="tasks")v.innerHTML=tasksView();else if(tabName==="family")v.innerHTML=familyView();else v.innerHTML=todayView()}
function todayView(){let d=today(),ev=visibleEvents(d);return `<div class="card"><div class="muted">DEIN TAG</div><h2>Heute ♡</h2></div><div class="card"><div class="between row"><h3>Termine</h3><button class="btn" onclick="openAdd('event','${d}')">＋ Termin</button></div>${ev.length?ev.map(eventHTML).join(""):`<p class="muted">Heute ist noch nichts eingetragen.</p>`}</div><div class="card"><div class="between row"><h3>Meine To-dos</h3><button class="btn" onclick="openAdd('task','${d}')">＋</button></div>${tasks.filter(t=>t.due_date===d).map(taskHTML).join("")||`<p class="muted">Noch keine To-dos.</p>`}</div>`}
function eventHTML(e){let c=cal(e.calendar_id);return `<div class="listitem row"><span class="swatch" style="background:${c.color||"#f4d9df"}"></span><div style="flex:1"><b>${esc(e.title)}</b><div class="muted">${esc(c.icon||"♡")} ${esc(c.name)}${e.starts_at?" · "+new Date(e.starts_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):""}</div></div></div>`}
function taskHTML(t){return `<div class="listitem row"><button class="check ${t.done?"done":""}" onclick="toggleTask('${t.id}',${!t.done})">${t.done?"✓":""}</button><div class="${t.done?"doneText":""}">${esc(t.text)}</div></div>`}
function monthView(){let y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells=[];for(let i=0;i<42;i++){let n=i-start+1,d,other=false;if(n<1){d=new Date(y,m-1,prev+n);other=true}else if(n>days){d=new Date(y,m+1,n-days);other=true}else d=new Date(y,m,n);let ds=iso(d),ev=visibleEvents(ds);cells.push(`<div class="day ${other?"other":""} ${ds===today()?"today":""}" onclick="openAdd('event','${ds}')"><div class="num">${d.getDate()}</div>${ev.slice(0,3).map(e=>`<div class="event" style="background:${cal(e.calendar_id).color||"#f4d9df"}">${esc(e.title)}</div>`).join("")}</div>`)}return `<div class="card"><div class="calendar-head"><button class="btn" onclick="cursor.setMonth(cursor.getMonth()-1);render()">‹</button><div class="month">${first.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}</div><button class="btn" onclick="cursor.setMonth(cursor.getMonth()+1);render()">›</button></div><div class="weekdays">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(x=>`<div>${x}</div>`).join("")}</div><div class="grid">${cells.join("")}</div></div>`}
function tasksView(){return `<div class="card"><div class="between row"><h2>Aufgaben ✓</h2><button class="btn" onclick="openAdd('task')">＋</button></div></div><div class="card">${tasks.length?tasks.map(taskHTML).join(""):`<p class="muted">Keine Aufgaben.</p>`}</div>`}
function familyView(){return `<div class="card"><div class="muted">FAMILIE</div><h2>Gemeinsame Kalender ♡</h2><p class="muted">Hier erscheinen alle Kalender, die dir über deine Familie freigegeben wurden.</p></div><div class="card">${calendars.length?calendars.map(c=>`<div class="calrow"><span class="swatch" style="background:${c.color||"#f4d9df"}"></span><div style="flex:1"><b>${esc(c.icon||"♡")} ${esc(c.name)}</b><span class="share">${esc(c.sharing||"details")}</span></div></div>`).join(""):`<p class="muted">Noch keine Kalender vorhanden.</p>`}</div><div class="card"><button class="btn" style="width:100%" onclick="logout()">Abmelden</button></div>`}
function openCalendars(){document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet"><div class="between row"><h2>Kalender</h2><button class="btn" onclick="closeModal()">×</button></div>${calendars.map(c=>`<div class="calrow"><span class="swatch" style="background:${c.color}"></span><span>${esc(c.icon||"♡")} ${esc(c.name)}</span></div>`).join("")}<button class="btn primary" style="width:100%;margin-top:12px" onclick="newCalendar()">＋ Kalender erstellen</button></div></div>`}
async function newCalendar(){let name=prompt("Wie soll der Kalender heißen?");if(!name)return;let sharing=prompt("Freigabe: details, busy oder private?","details")||"details";if(!["details","busy","private"].includes(sharing))sharing="details";let {error}=await db.from("calendars").insert({owner_id:user.id,name,icon:"♡",color:"#f4d9df",sharing});if(error)return alert(error.message);closeModal();await load();render()}
function openAdd(type="event",date=today()){if(type==="task"){document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet"><h2>Neues To-do</h2><div class="label">Aufgabe</div><input id="fText"><div class="label">Datum</div><input id="fDate" type="date" value="${date||""}"><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveTask()">Speichern</button></div></div>`;return}if(!calendars.length)return alert("Erstelle zuerst einen Kalender.");document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet"><div class="between row"><h2>Neuer Termin ♡</h2><button class="btn" onclick="closeModal()">×</button></div><div class="label">Titel</div><input id="fTitle"><div class="row"><div style="flex:1"><div class="label">Start</div><input id="fDate" type="date" value="${date}"></div><div style="flex:1"><div class="label">Ende</div><input id="fEndDate" type="date" value="${date}"></div></div><div class="label">Kalender</div><select id="fCal">${calendars.map(c=>`<option value="${c.id}">${esc(c.icon||"♡")} ${esc(c.name)}</option>`).join("")}</select><div class="label">Notiz</div><textarea id="fNote"></textarea><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveEvent()">Speichern</button></div></div>`}
async function saveEvent(){let title=fTitle.value.trim();if(!title)return alert("Bitte Titel eingeben.");let {error}=await db.from("events").insert({calendar_id:fCal.value,owner_id:user.id,title,start_date:fDate.value,end_date:fEndDate.value||fDate.value,all_day:true,note:fNote.value,recurrence:{type:"none"}});if(error)return alert(error.message);closeModal();await load();render()}
async function saveTask(){let text=fText.value.trim();if(!text)return;let {error}=await db.from("tasks").insert({owner_id:user.id,text,due_date:fDate.value||null,done:false});if(error)return alert(error.message);closeModal();await load();render()}
async function toggleTask(id,done){let {error}=await db.from("tasks").update({done}).eq("id",id);if(error)return alert(error.message);await load();render()}
function closeModal(){document.getElementById("modal").innerHTML=""}
boot();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script>
</body></html>
