<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7f4">
<title>My Planner ♡</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fbf7f4;--paper:#fffefd;--ink:#403839;--muted:#a49798;--line:#eee1df;--pink:#efc8d2;--soft:#f1e8e6;--shadow:0 10px 30px #70505010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))}
header{padding:20px 5px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font:28px Georgia,serif}.sub,.muted{color:var(--muted);font-size:13px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin:10px 0}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}
.btn{border:0;border-radius:14px;padding:10px 13px;background:var(--soft)}.primary{background:var(--pink)}.wide{width:100%;margin-top:10px}.round{width:44px;height:44px;border-radius:50%;font-size:24px;padding:0}
h2,h3,p{margin:5px 0}h2{font:22px Georgia,serif}h3{font-size:15px}.label{font-size:12px;color:var(--muted);margin:11px 2px 5px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px}textarea{min-height:70px;resize:vertical}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffefdf2;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{width:min(25%,190px);border:0;background:none;padding:10px 2px;color:#8d8182;font-size:11px}.tabs b{display:block;font-size:20px}.tabs .on{color:#7d5960}
.fab{position:fixed;right:20px;bottom:82px;z-index:25;background:#e9c5ce}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.month{font:22px Georgia,serif}
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekdays div{text-align:center;color:var(--muted);font-size:11px;padding:5px}
.day{min-height:78px;border:1px solid var(--line);border-radius:12px;padding:5px;background:#fff;overflow:hidden}.day.other{opacity:.38}.day.today{outline:2px solid #e8c3cc}.num{font-size:12px;margin-bottom:3px}
.event{font-size:8px;border-radius:6px;padding:3px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.listitem{padding:11px 0;border-bottom:1px solid var(--line)}.swatch{width:15px;height:15px;border-radius:50%;flex:0 0 auto}
.modal{position:fixed;inset:0;background:#463b3b55;display:flex;align-items:flex-end;justify-content:center;z-index:50}.sheet{background:var(--bg);width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:25px 25px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:6px 9px;font-size:11px;background:#fff}.code{font:700 24px ui-monospace,monospace;letter-spacing:2px;text-align:center;padding:12px}
.check{width:22px;height:22px;border:1px solid #d7c7c8;border-radius:7px;background:#fff;flex:0 0 auto}.check.done{background:#dce8dd}.doneText{text-decoration:line-through;color:var(--muted)}
@media(max-width:480px){.day{min-height:76px;padding:4px}.card{padding:14px}.brand{font-size:25px}}
</style>
</head>
<body><div class="app">
<header><div><div class="brand">My Planner ♡</div><div class="sub" id="hello">Family Sync</div></div><button class="btn" id="calBtn" onclick="openCalendars()">Kalender</button></header>
<main id="view"></main>
<button class="btn round fab" id="fab" onclick="openAdd()">＋</button>
<nav class="tabs" id="tabs">
<button data-tab="today" onclick="tab('today')"><b>♡</b>Heute</button>
<button data-tab="month" onclick="tab('month')"><b>▦</b>Kalender</button>
<button data-tab="tasks" onclick="tab('tasks')"><b>✓</b>Aufgaben</button>
<button data-tab="family" onclick="tab('family')"><b>⌂</b>Familie</button>
</nav></div><div id="modal"></div>
<script>
const SUPABASE_URL="https://ijgfuksbvggowqzgucjp.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqZ2Z1a3Nidmdnb3dxemd1Y2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MTUxMTksImV4cCI6MjEwNTQ5MTExOX0.D8aHYQw7s3Gcg61Nzu8vWQHlj6ZKM2JnE6djnzq2cP4";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const colors=["#dceaf5","#f4d9df","#e7def1","#dfeadf","#f7e2d4","#f6edcf"];
let session=null,profile=null,family=null,members=[],calendars=[],events=[],tasks=[],familyDebug={},tabName="today",cursor=new Date();cursor.setDate(1);
const esc=s=>(s??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const iso=d=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}, today=()=>iso(new Date());
const cal=id=>calendars.find(c=>c.id===id);
function msg(x){alert(x)}
async function boot(){
 const {data}=await db.auth.getSession();session=data.session;
 db.auth.onAuthStateChange((_e,s)=>{session=s;setTimeout(load,0)});
 await load();
}
async function load(){
 if(!session){renderAuth();return}
 const uid=session.user.id;
 familyDebug={uid, errors:[]};
 let p=await db.from("profiles").select("*").eq("id",uid).maybeSingle();profile=p.data;
 if(p.error) familyDebug.errors.push("profiles: "+p.error.message);
 family=null;members=[];
 // Owners can load the family directly. This avoids a circular RLS dependency
 // while still allowing joined family members to resolve their membership.
 let ownFamily=await db.from("families").select("*").eq("created_by",uid).order("created_at",{ascending:false}).limit(1).maybeSingle();
 familyDebug.ownFamily=ownFamily.data||null; if(ownFamily.error) familyDebug.errors.push("families(owner): "+ownFamily.error.message);
 if(ownFamily.data){
   family=ownFamily.data;
 }else{
   let fm=await db.from("family_members").select("family_id,role").eq("user_id",uid).limit(1);
   familyDebug.membership=fm.data||[]; if(fm.error) familyDebug.errors.push("family_members: "+fm.error.message);
   if(fm.data?.length){
     let f=await db.from("families").select("*").eq("id",fm.data[0].family_id).maybeSingle();
     if(f.error) familyDebug.errors.push("families(id): "+f.error.message);
     family=f.data;
   }
 }
 if(family){
   let ms=await db.from("family_members").select("user_id,role,joined_at").eq("family_id",family.id);
   members=ms.data||[];
 }
 let cs=await db.from("calendars").select("*").order("created_at");calendars=cs.data||[];
 let es=await db.from("events").select("*").order("start_date");events=es.data||[];
 let ts=await db.from("tasks").select("*").order("due_date");tasks=ts.data||[];
 render();
}
function renderAuth(){
 document.getElementById("tabs").style.display="none";document.getElementById("fab").style.display="none";document.getElementById("calBtn").style.display="none";
 document.getElementById("hello").textContent="Family Sync";
 document.getElementById("view").innerHTML=`<div class="card" style="margin-top:80px"><div class="muted">FAMILY PLANNER</div><h2>Willkommen ♡</h2><p class="muted">Melde dich an oder erstelle ein Konto.</p><div class="label">Name (nur bei Registrierung)</div><input id="aName" placeholder="Dein Name"><div class="label">E-Mail</div><input id="aEmail" type="email"><div class="label">Passwort</div><input id="aPass" type="password"><button class="btn primary wide" onclick="signIn()">Anmelden</button><button class="btn wide" onclick="signUp()">Konto erstellen</button></div>`;
}
async function signUp(){let email=aEmail.value.trim(),password=aPass.value,name=aName.value.trim()||"User";let {error}=await db.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:location.origin+location.pathname}});if(error)return msg(error.message);msg("Konto erstellt ♡ Falls du eine Bestätigungs-Mail bekommst, bestätige sie und öffne danach die App erneut.")}
async function signIn(){let {error}=await db.auth.signInWithPassword({email:aEmail.value.trim(),password:aPass.value});if(error)msg(error.message)}
async function signOut(){await db.auth.signOut()}
function tab(t){tabName=t;render()}
function render(){
 document.getElementById("tabs").style.display="flex";document.getElementById("fab").style.display="block";document.getElementById("calBtn").style.display="block";
 document.getElementById("hello").textContent=new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tabName));
 if(tabName==="family")familyView();else if(tabName==="month")monthView();else if(tabName==="tasks")tasksView();else todayView();
}
function dateDiffDays(a,b){return Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/86400000)}
function eventOccursOn(e,d){
  if(!e.start_date||d<e.start_date)return false;
  const duration=Math.max(0,dateDiffDays(e.start_date,e.end_date||e.start_date));
  const r=e.recurrence||{type:"none"};
  if(!r.type||r.type==="none")return d<= (e.end_date||e.start_date);
  if(r.type==="days"){
    const n=Math.max(1,Number(r.interval)||1), diff=dateDiffDays(e.start_date,d);
    for(let off=0;off<=duration;off++) if(diff>=off&&(diff-off)%n===0)return true;
    return false;
  }
  if(r.type==="weekly"){
    const diff=dateDiffDays(e.start_date,d);
    for(let off=0;off<=duration;off++) if(diff>=off&&(diff-off)%7===0)return true;
    return false;
  }
  if(r.type==="yearly"){
    const start=new Date(e.start_date+"T12:00"), cur=new Date(d+"T12:00");
    for(let off=0;off<=duration;off++){
      const x=new Date(start);x.setDate(x.getDate()+off);
      if(x.getMonth()===cur.getMonth()&&x.getDate()===cur.getDate())return true;
    }
    return false;
  }
  return d<= (e.end_date||e.start_date);
}
function ownEvents(d){return events.filter(e=>eventOccursOn(e,d))}
function eventTimeValue(v){if(!v)return "";let m=String(v).match(/T(\d{2}:\d{2})/);return m?m[1]:String(v).slice(0,5)} function eventTimestamp(date,time){return time?`${date}T${time}:00`:null} function eventLine(e){let c=cal(e.calendar_id);let tm=!e.all_day&&e.starts_at?` · ${eventTimeValue(e.starts_at)}${e.ends_at?`–${eventTimeValue(e.ends_at)}`:""}`:"";return `<div class="listitem row" onclick="${e.owner_id===session.user.id?`editEvent('${e.id}')`:''}"><span class="swatch" style="background:${c?.color||'#ddd'}"></span><div><b>${esc(e.title)}</b><div class="muted">${esc(c?.icon||'♡')} ${esc(c?.name||'Kalender')}${tm}</div></div></div>`}
function todayView(){let d=today(),ev=ownEvents(d),ts=tasks.filter(t=>t.due_date===d);document.getElementById("view").innerHTML=`<div class="card"><div class="muted">DEIN TAG</div><h2>Heute ♡</h2></div><div class="card"><div class="between row"><h3>Termine</h3><button class="btn" onclick="openAdd('event','${d}')">＋ Termin</button></div>${ev.length?ev.map(eventLine).join(""):`<p class="muted" style="padding:12px 0">Heute ist noch nichts eingetragen.</p>`}</div><div class="card"><div class="between row"><h3>Meine To-dos</h3><button class="btn" onclick="openAdd('task','${d}')">＋</button></div>${ts.length?ts.map(taskLine).join(""):`<p class="muted">Noch keine To-dos.</p>`}</div>`}
function monthView(){let y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells=[];
for(let i=0;i<42;i++){let n=i-start+1,d,other=false;if(n<1){d=new Date(y,m-1,prev+n);other=true}else if(n>days){d=new Date(y,m+1,n-days);other=true}else d=new Date(y,m,n);let ds=iso(d),ev=ownEvents(ds);cells.push(`<div class="day ${other?"other":""} ${ds===today()?"today":""}" onclick="daySheet('${ds}')"><div class="num">${d.getDate()}</div>${ev.slice(0,3).map(e=>`<div class="event" style="background:${cal(e.calendar_id)?.color||'#eee'}">${esc(e.title)}</div>`).join("")}</div>`)}
document.getElementById("view").innerHTML=`<div class="card"><div class="calendar-head"><button class="btn" onclick="cursor.setMonth(cursor.getMonth()-1);monthView()">‹</button><div class="month">${first.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}</div><button class="btn" onclick="cursor.setMonth(cursor.getMonth()+1);monthView()">›</button></div><div class="weekdays">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(x=>`<div>${x}</div>`).join("")}</div><div class="grid">${cells.join("")}</div></div>`}
function taskLine(t){return `<div class="listitem row"><button class="check ${t.done?"done":""}" onclick="toggleTask('${t.id}',${!t.done})">${t.done?"✓":""}</button><div class="${t.done?"doneText":""}">${esc(t.text)}${t.due_time?`<div class="muted">${t.due_time.slice(0,5)}</div>`:""}</div></div>`}
function tasksView(){document.getElementById("view").innerHTML=`<div class="card"><div class="between row"><h2>Aufgaben ✓</h2><button class="btn" onclick="openAdd('task')">＋</button></div></div><div class="card">${tasks.length?tasks.map(taskLine).join(""):`<p class="muted">Noch keine Aufgaben.</p>`}</div>`}
async function familyView(){
 document.getElementById("fab").style.display="none";
 if(!family){document.getElementById("view").innerHTML=`<div class="card"><div class="muted">FAMILIE</div><h2>Gemeinsam planen ♡</h2><p class="muted">Erstelle eure Familiengruppe oder tritt mit einem Einladungscode bei.</p></div><div class="card"><h3>Familie erstellen</h3><div class="label">Name</div><input id="familyName" value="Familie"><button class="btn primary wide" onclick="createFamily()">Familie erstellen</button></div><div class="card"><h3>Familie beitreten</h3><div class="label">Einladungscode</div><input id="joinCode" placeholder="z. B. A1B2C3D4"><button class="btn wide" onclick="joinFamily()">Mit Code beitreten</button></div><div class="card"><button class="btn wide" onclick="signOut()">Abmelden</button></div>`;return}
 let shared=calendars.filter(c=>c.family_id===family.id);
 document.getElementById("view").innerHTML=`<div class="card"><div class="muted">FAMILIE</div><h2>${esc(family.name)} ♡</h2><p class="muted">Diesen Code schickst du Mama und deinem Bruder. Sie erstellen zuerst einen eigenen Account und treten danach damit bei.</p><div class="code">${esc(family.invite_code)}</div><button class="btn wide" onclick="copyCode()">Code kopieren</button></div><div class="card"><div class="between row"><h3>Freigegebene Kalender</h3><button class="btn" onclick="openNewCalendar(true)">＋</button></div>${shared.length?shared.map(c=>`<div class="listitem row"><span class="swatch" style="background:${c.color}"></span><div style="flex:1"><b>${esc(c.icon+" "+c.name)}</b><div class="muted">${c.owner_id===session.user.id?"Von dir":"Familienmitglied"} · ${c.sharing==="details"?"Details sichtbar":c.sharing==="busy"?"Nur beschäftigt":"Privat"}</div></div>${c.owner_id===session.user.id?`<button class="btn" onclick="editCalendar('${c.id}')">✎</button>`:""}</div>`).join(""):`<p class="muted">Noch keine Kalender freigegeben.</p>`}</div><div class="card"><p class="muted">Mitglieder: ${members.length}</p><button class="btn wide" onclick="signOut()">Abmelden</button></div>`}
async function createFamily(){let b=document.querySelector('button[onclick="createFamily()"]');if(b){b.disabled=true;b.textContent="Wird erstellt …"}let {error}=await db.rpc("create_family",{p_name:familyName.value.trim()||"Familie"});if(error){if(b){b.disabled=false;b.textContent="Familie erstellen"}return msg(error.message)}await load()}
async function joinFamily(){let {error}=await db.rpc("join_family",{p_code:joinCode.value.trim()});if(error)return msg(error.message);await load()}
async function copyCode(){try{await navigator.clipboard.writeText(family.invite_code);msg("Einladungscode kopiert ♡")}catch(e){msg("Code: "+family.invite_code)}}
function openCalendars(){document.getElementById("modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="between row"><h2>Meine Kalender</h2><button class="btn" onclick="closeModal()">Fertig</button></div>${calendars.filter(c=>c.owner_id===session.user.id).map(c=>`<div class="listitem row"><span class="swatch" style="background:${c.color}"></span><div style="flex:1"><b>${esc(c.icon+" "+c.name)}</b><div class="muted">${c.family_id?"Familie · ":"Nur ich · "}${c.sharing}</div></div><button class="btn" onclick="editCalendar('${c.id}')">✎</button></div>`).join("")}<button class="btn primary wide" onclick="openNewCalendar(false)">＋ Neuen Kalender erstellen</button></div></div>`}
function openNewCalendar(share=false){document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet"><div class="between row"><h2>Neuer Kalender ♡</h2><button class="btn" onclick="closeModal()">×</button></div><div class="label">Name</div><input id="cName" placeholder="z. B. Schule, Mo, Arbeit"><div class="label">Symbol</div><input id="cIcon" value="♡"><div class="label">Farbe</div><input id="cColor" type="color" value="#f4d9df"><div class="label">Freigabe</div><select id="cShare"><option value="private">Privat – nur ich</option>${family?`<option value="details" ${share?"selected":""}>Familie – Details sichtbar</option><option value="busy">Familie – nur beschäftigt</option>`:""}</select><button class="btn primary wide" onclick="saveCalendar()">Speichern</button></div></div>`}
async function saveCalendar(){let sharing=cShare.value,fid=sharing==="private"?null:family?.id;let {error}=await db.from("calendars").insert({owner_id:session.user.id,family_id:fid,name:cName.value.trim()||"Kalender",icon:cIcon.value.trim()||"♡",color:cColor.value,sharing});if(error)return msg(error.message);closeModal();await load()}
function editCalendar(id){let c=cal(id);document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet"><div class="between row"><h2>Kalender bearbeiten</h2><button class="btn" onclick="closeModal()">×</button></div><div class="label">Name</div><input id="cName" value="${esc(c.name)}"><div class="label">Symbol</div><input id="cIcon" value="${esc(c.icon)}"><div class="label">Farbe</div><input id="cColor" type="color" value="${c.color}"><div class="label">Freigabe</div><select id="cShare"><option value="private" ${c.sharing==="private"?"selected":""}>Privat – nur ich</option>${family?`<option value="details" ${c.sharing==="details"?"selected":""}>Familie – Details sichtbar</option><option value="busy" ${c.sharing==="busy"?"selected":""}>Familie – nur beschäftigt</option>`:""}</select><button class="btn primary wide" onclick="updateCalendar('${id}')">Speichern</button></div></div>`}
async function updateCalendar(id){let sharing=cShare.value;let {error}=await db.from("calendars").update({name:cName.value.trim(),icon:cIcon.value.trim()||"♡",color:cColor.value,sharing,family_id:sharing==="private"?null:family?.id}).eq("id",id);if(error)return msg(error.message);closeModal();await load()}
function openAdd(type="event",date=today()){if(type==="task")return taskForm(date);if(!calendars.some(c=>c.owner_id===session.user.id)){msg("Erstelle zuerst oben unter „Kalender“ einen Kalender ♡");return}document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet"><div class="between row"><h2>Neuer Termin ♡</h2><button class="btn" onclick="closeModal()">×</button></div>${eventForm(date)}</div></div>`}
function eventForm(date,e=null){let x=e||{title:"",start_date:date,end_date:date,all_day:true,starts_at:null,ends_at:null,calendar_id:calendars.find(c=>c.owner_id===session.user.id)?.id,note:"",recurrence:{type:"none"}};let r=x.recurrence||{type:"none"};return `<div class="label">Titel</div><input id="eTitle" value="${esc(x.title)}"><div class="row"><div style="flex:1"><div class="label">Startdatum</div><input id="eStart" type="date" value="${x.start_date}"></div><div style="flex:1"><div class="label">Enddatum</div><input id="eEnd" type="date" value="${x.end_date}"></div></div><div class="row"><div style="flex:1"><div class="label">Von</div><input id="eStartTime" type="time" value="${x.starts_at?String(x.starts_at).slice(0,5):""}"></div><div style="flex:1"><div class="label">Bis</div><input id="eEndTime" type="time" value="${x.ends_at?String(x.ends_at).slice(0,5):""}"></div></div><div class="muted" style="margin:4px 0 10px">Zeiten sind optional.</div><div class="label">Kalender</div><select id="eCal">${calendars.filter(c=>c.owner_id===session.user.id).map(c=>`<option value="${c.id}" ${x.calendar_id===c.id?"selected":""}>${esc(c.icon+" "+c.name)}</option>`).join("")}</select><div class="label">Wiederholung</div><select id="eRec" onchange="document.getElementById('recN').style.display=this.value==='days'?'block':'none'"><option value="none" ${r.type==="none"?"selected":""}>Keine</option><option value="weekly" ${r.type==="weekly"?"selected":""}>Jede Woche</option><option value="yearly" ${r.type==="yearly"?"selected":""}>Jedes Jahr</option><option value="days" ${r.type==="days"?"selected":""}>Alle … Tage</option></select><div id="recN" style="display:${r.type==="days"?"block":"none"}"><div class="label">Alle wie viele Tage?</div><input id="eInterval" type="number" min="1" value="${r.interval||3}"></div><div class="label">Notiz / Ort</div><textarea id="eNote">${esc(x.note||"")}</textarea><button class="btn primary wide" onclick="${e?`updateEvent('${e.id}')`:"saveEvent()"}">Speichern</button>${e?`<button class="btn wide" onclick="deleteEvent('${e.id}')">Termin löschen</button>`:""}`}
async function saveEvent(){if(!eTitle.value.trim())return msg("Bitte Titel eingeben.");let rec=eRec.value==="days"?{type:"days",interval:+eInterval.value||1}:{type:eRec.value};let {error}=await db.from("events").insert({owner_id:session.user.id,calendar_id:eCal.value,title:eTitle.value.trim(),start_date:eStart.value,end_date:eEnd.value<eStart.value?eStart.value:eEnd.value,all_day:!eStartTime.value,starts_at:eventTimestamp(eStart.value,eStartTime.value),ends_at:eventTimestamp(eEnd.value<eStart.value?eStart.value:eEnd.value,eEndTime.value),note:eNote.value,recurrence:rec});if(error)return msg(error.message);closeModal();await load()}
function editEvent(id){let e=events.find(x=>x.id===id);if(!e)return;document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet"><div class="between row"><h2>Termin bearbeiten ✎</h2><button class="btn" onclick="closeModal()">×</button></div>${eventForm(e.start_date,e)}</div></div>`}
async function updateEvent(id){let rec=eRec.value==="days"?{type:"days",interval:+eInterval.value||1}:{type:eRec.value};let {error}=await db.from("events").update({calendar_id:eCal.value,title:eTitle.value.trim(),start_date:eStart.value,end_date:eEnd.value<eStart.value?eStart.value:eEnd.value,all_day:!eStartTime.value,starts_at:eventTimestamp(eStart.value,eStartTime.value),ends_at:eventTimestamp(eEnd.value<eStart.value?eStart.value:eEnd.value,eEndTime.value),note:eNote.value,recurrence:rec,updated_at:new Date().toISOString()}).eq("id",id);if(error)return msg(error.message);closeModal();await load()}
async function deleteEvent(id){if(confirm("Termin wirklich löschen?")){await db.from("events").delete().eq("id",id);closeModal();await load()}}
function taskForm(date=""){document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet"><div class="between row"><h2>Neues To-do ♡</h2><button class="btn" onclick="closeModal()">×</button></div><div class="label">Aufgabe</div><input id="tText"><div class="label">Datum (optional)</div><input id="tDate" type="date" value="${date||""}"><div class="label">Uhrzeit (optional)</div><input id="tTime" type="time"><button class="btn primary wide" onclick="saveTask()">Speichern</button></div></div>`}
async function saveTask(){if(!tText.value.trim())return;let {error}=await db.from("tasks").insert({owner_id:session.user.id,text:tText.value.trim(),due_date:tDate.value||null,due_time:tTime.value||null});if(error)return msg(error.message);closeModal();await load()}
async function toggleTask(id,done){await db.from("tasks").update({done}).eq("id",id);await load()}
function daySheet(date){let ev=ownEvents(date),ts=tasks.filter(t=>t.due_date===date);document.getElementById("modal").innerHTML=`<div class="modal"><div class="sheet"><div class="between row"><h2>${new Date(date+"T12:00").toLocaleDateString("de-DE",{day:"numeric",month:"long"})}</h2><button class="btn" onclick="closeModal()">×</button></div><div class="card"><div class="between row"><h3>Termine</h3><button class="btn" onclick="openAdd('event','${date}')">＋</button></div>${ev.length?ev.map(eventLine).join(""):`<p class="muted">Keine Termine.</p>`}</div><div class="card"><div class="between row"><h3>To-dos</h3><button class="btn" onclick="openAdd('task','${date}')">＋</button></div>${ts.length?ts.map(taskLine).join(""):`<p class="muted">Keine To-dos.</p>`}</div></div></div>`}
function closeModal(){document.getElementById("modal").innerHTML=""}
boot();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
